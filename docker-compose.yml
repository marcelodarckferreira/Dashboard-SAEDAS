version: "3.8"

services:
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    image: dashboard-saedas:latest
    container_name: dashboard-saedas
    ports:
      - "8501:8501"
    volumes:
      - ./app:/SAEDAS/app
    working_dir: /SAEDAS
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: America/Sao_Paulo

      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-saedas_redis_pass}

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dashboard-saedas-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-saedas_redis_pass}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-saedas_redis_pass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  redis_data:
